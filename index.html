<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080c15">
<title>答案之书 v0.1 · The Book of Answers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230b1424'/%3E%3Cpath d='M31 20 L15 23 v20 l16-3.5 16 3.5 V23 Z' fill='%23e3c68e'/%3E%3Cpath d='M32 20.6 V40' stroke='%238a7238' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  :root{
    --stage: min(820px, 92vw, 104vh);
    --u: calc(var(--stage) / 780);
    --gold: #e8ce96;
    --gold-soft: rgba(232,206,150,.55);
    --gold-dim: rgba(232,206,150,.16);
    --ink: #eee8db;
    --muted: #7d8ba4;
    --card-w: 604;
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    background:
      radial-gradient(120% 85% at 50% 0%, #12203a 0%, rgba(18,32,58,0) 55%),
      linear-gradient(180deg, #0a101c 0%, #06090f 100%);
    color: var(--ink);
    font-family: "Microsoft YaHei UI Light", "Microsoft YaHei UI", "Microsoft YaHei",
                 "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- 背景层 ---------- */
  #dust{ position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .vignette{
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(115% 88% at 50% 46%, rgba(0,0,0,0) 38%, rgba(2,4,8,.72) 100%);
  }

  .aura{
    position: fixed; left: 50%; top: 47%; width: 110vmin; height: 82vmin;
    transform: translate(-50%, -50%);
    pointer-events: none; z-index: 0;
    background: radial-gradient(closest-side, rgba(232,197,133,.17), rgba(232,197,133,.06) 55%, rgba(232,197,133,0) 100%);
    animation: breathe 9s ease-in-out infinite;
  }

  @keyframes breathe{
    0%, 100%{ opacity: .55; transform: translate(-50%, -50%) scale(1); }
    50%{ opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  }

  /* ---------- 舞台 ---------- */
  .stage{
    position: relative; z-index: 2;
    width: var(--stage);
    display: flex; flex-direction: column; align-items: center;
    padding-top: calc(52 * var(--u));
    padding-bottom: calc(26 * var(--u));
  }

  /* ---------- 标题 ---------- */
  h1{
    margin: 0;
    font-size: calc(30 * var(--u));
    font-weight: 300;
    letter-spacing: calc(15 * var(--u));
    text-indent: calc(15 * var(--u));      /* 抵消末字后多出的字距，保持视觉居中 */
    color: #ecd6a4;
    text-shadow: 0 calc(2 * var(--u)) calc(12 * var(--u)) rgba(0,0,0,.55),
                 0 0 calc(28 * var(--u)) rgba(232,206,150,.16);
    white-space: nowrap;
  }

  .rule{
    display: flex; align-items: center; justify-content: center;
    gap: calc(13 * var(--u));
    margin-top: calc(11 * var(--u));
    width: calc(160 * var(--u));
  }
  .rule i{
    flex: 1; height: 1px;
    background: linear-gradient(90deg, rgba(232,206,150,0), rgba(232,206,150,.42));
  }
  .rule i:last-child{
    background: linear-gradient(90deg, rgba(232,206,150,.42), rgba(232,206,150,0));
  }
  .dia{
    width: calc(7 * var(--u)); height: calc(7 * var(--u));
    background: var(--gold);
    transform: rotate(45deg);
    opacity: .85;
    flex: none;
  }

  .sub{
    margin: calc(13 * var(--u)) 0 0;
    font-size: calc(9 * var(--u));
    letter-spacing: calc(4.6 * var(--u));
    text-indent: calc(4.6 * var(--u));
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    color: #6c7a92;
    white-space: nowrap;
  }

  /* ---------- 书页卡片 ---------- */
  .card{
    position: relative;
    margin-top: calc(24 * var(--u));
    width: calc(604 / 780 * 100%);
    height: calc(326 * var(--u));
    border-radius: calc(17 * var(--u));
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(120,150,210,.07), rgba(120,150,210,0) 60%),
      linear-gradient(180deg, #182237 0%, #0b111d 100%);
    box-shadow:
      0 calc(34 * var(--u)) calc(80 * var(--u)) calc(-24 * var(--u)) rgba(0,0,0,.85),
      0 0 0 1px rgba(232,206,150,.10) inset;
    cursor: pointer;
    overflow: hidden;
    isolation: isolate;
  }

  /* 金色描边（渐变 + 内描边） */
  .card::before{
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
    background: linear-gradient(180deg, rgba(234,205,154,.62), rgba(234,205,154,.10) 70%, rgba(234,205,154,.22));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
    pointer-events: none;
    z-index: 4;
  }
  .card::after{
    content: ""; position: absolute; inset: calc(9 * var(--u));
    border-radius: calc(11 * var(--u));
    border: 1px solid rgba(235,210,165,.075);
    pointer-events: none;
    z-index: 3;
  }

  .bracket{
    position: absolute; width: calc(16 * var(--u)); height: calc(16 * var(--u));
    border-color: rgba(232,203,150,.42); border-style: solid; border-width: 0;
    z-index: 4; pointer-events: none;
  }
  .bracket.tl{ left: calc(21 * var(--u));  top: calc(21 * var(--u));    border-left-width: 1px; border-top-width: 1px; }
  .bracket.tr{ right: calc(21 * var(--u)); top: calc(21 * var(--u));    border-right-width: 1px; border-top-width: 1px; }
  .bracket.bl{ left: calc(21 * var(--u));  bottom: calc(21 * var(--u)); border-left-width: 1px; border-bottom-width: 1px; }
  .bracket.br{ right: calc(21 * var(--u)); bottom: calc(21 * var(--u));  border-right-width: 1px; border-bottom-width: 1px; }

  /* 翻开时的光带 */
  .sweep{
    position: absolute; top: 0; bottom: 0; left: 0; width: 34%;
    transform: translateX(-115%);
    background: linear-gradient(90deg,
      rgba(255,241,208,0) 0%,
      rgba(255,241,208,.055) 32%,
      rgba(255,241,208,.11) 50%,
      rgba(255,241,208,.055) 68%,
      rgba(255,241,208,0) 100%);
    opacity: 0; pointer-events: none; z-index: 1;
  }
  .sweep::after{
    content: ""; position: absolute; top: 6%; bottom: 6%; right: 0; width: 1px;
    background: linear-gradient(180deg, rgba(255,246,220,0), rgba(255,246,220,.5), rgba(255,246,220,0));
  }
  .card.sweeping .sweep{ animation: sweep 640ms cubic-bezier(.32,.02,.28,1) forwards; }
  @keyframes sweep{
    0%{ transform: translateX(-115%); opacity: 0; }
    12%{ opacity: 1; }
    100%{ transform: translateX(310%); opacity: .9; }
  }

  /* ---------- 卡片内容 ---------- */
  .center{
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 calc(60 * var(--u));
  }

  /* 静候态 */
  .idle{
    display: flex; flex-direction: column; align-items: center;
    transition: opacity .2s ease, transform .3s ease;
  }
  .idle.hide{ opacity: 0; transform: translateY(calc(-6 * var(--u))); }

  .needle{
    width: 1px; height: calc(34 * var(--u));
    background: linear-gradient(180deg, rgba(232,206,150,.15), rgba(232,206,150,.62));
    margin-bottom: calc(9 * var(--u));
  }
  .idle .dia{ margin-bottom: calc(22 * var(--u)); animation: twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{
    0%,100%{ opacity: .55; transform: rotate(45deg) scale(1); }
    50%{ opacity: .95; transform: rotate(45deg) scale(1.12); }
  }

  .ask{
    margin: 0;
    font-size: calc(22 * var(--u));
    font-weight: 300;
    letter-spacing: calc(2.6 * var(--u));
    text-indent: calc(2.6 * var(--u));
    color: #d9e1ee;
  }
  .then{
    margin: calc(17 * var(--u)) 0 0;
    font-size: calc(12.5 * var(--u));
    letter-spacing: calc(1.8 * var(--u));
    text-indent: calc(1.8 * var(--u));
    color: #7c8ba3;
  }

  /* 答案态 */
  .answer-wrap{
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 calc(75 * var(--u));
    opacity: 0; visibility: hidden;
  }
  .answer-wrap.on{ opacity: 1; visibility: visible; }

  .answer{
    margin: 0;
    max-width: 100%;
    font-size: calc(44 * var(--u));
    font-weight: 300;
    line-height: 1.5;
    letter-spacing: .01em;
    color: var(--ink);
    text-align: center;
    white-space: normal;
    word-break: break-word;
    text-wrap: balance;
    filter: drop-shadow(0 0 calc(18 * var(--u)) rgba(232,206,150,.10));
  }
  .answer span{
    display: inline-block;
    white-space: pre;
    opacity: 0;
    transform: translateY(.16em);
    filter: blur(calc(5 * var(--u)));
    will-change: opacity, transform, filter;
  }
  .answer-wrap.reveal .answer span{
    animation: ch 540ms cubic-bezier(.19,.72,.28,1) forwards;
    animation-delay: calc(var(--i) * 28ms);
  }
  @keyframes ch{
    to{ opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* 下划线 */
  .under{
    display: flex; align-items: center; justify-content: center;
    gap: calc(9 * var(--u));
    margin-top: calc(24 * var(--u));
    width: calc(196 * var(--u));
    opacity: 0;
  }
  .under i{
    flex: 1; height: 1px; transform: scaleX(0); transform-origin: center;
    background: linear-gradient(90deg, rgba(232,206,150,0), rgba(232,206,150,.72), rgba(232,206,150,0));
  }
  .under .dia{ width: calc(5 * var(--u)); height: calc(5 * var(--u)); opacity: 0; }
  .answer-wrap.reveal .under{ animation: fadeIn .4s ease forwards; animation-delay: var(--d); }
  .answer-wrap.reveal .under i{ animation: grow 520ms cubic-bezier(.2,.7,.3,1) forwards; animation-delay: var(--d); }
  .answer-wrap.reveal .under .dia{ animation: fadeIn .5s ease forwards; animation-delay: calc(var(--d) + 180ms); }
  @keyframes grow{ to{ transform: scaleX(1); } }
  @keyframes fadeIn{ to{ opacity: 1; } }

  /* 页码 */
  .page{
    position: absolute; left: 0; right: 0; bottom: calc(30 * var(--u));
    margin: 0; text-align: center;
    font-size: calc(12 * var(--u));
    letter-spacing: calc(1.4 * var(--u));
    text-indent: calc(1.4 * var(--u));
    color: #a08a57;
    opacity: 0;
    z-index: 3;
  }
  .answer-wrap.reveal .page{ animation: fadeIn .6s ease forwards; animation-delay: var(--dp); }

  /* 立即完成 */
  .answer-wrap.instant .answer span,
  .answer-wrap.instant .under,
  .answer-wrap.instant .under i,
  .answer-wrap.instant .under .dia,
  .answer-wrap.instant .page,
  .answer-wrap.done .answer span,
  .answer-wrap.done .under,
  .answer-wrap.done .under i,
  .answer-wrap.done .under .dia,
  .answer-wrap.done .page{
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
  }

  /* ---------- 底部 ---------- */
  .hint{
    margin-top: calc(42 * var(--u));
    font-size: calc(12.5 * var(--u));
    letter-spacing: calc(2 * var(--u));
    text-indent: calc(2 * var(--u));
    color: #8997b0;
    animation: hintPulse 4.2s ease-in-out infinite;
    transition: opacity .25s ease;
  }
  @keyframes hintPulse{ 0%,100%{ opacity: .72; } 50%{ opacity: 1; } }

  .foot{
    margin-top: calc(38 * var(--u));
    font-size: calc(10.8 * var(--u));
    letter-spacing: calc(1.4 * var(--u));
    text-indent: calc(1.4 * var(--u));
    color: #646f83;
  }
  .foot b{ font-weight: 400; color: #7d899e; }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed; left: 50%; bottom: calc(46 * var(--u)); z-index: 20;
    transform: translate(-50%, calc(10 * var(--u)));
    padding: calc(9 * var(--u)) calc(19 * var(--u));
    border-radius: 999px;
    border: 1px solid rgba(232,206,150,.22);
    background: rgba(16,23,36,.9);
    backdrop-filter: blur(6px);
    font-size: calc(12 * var(--u));
    letter-spacing: calc(.6 * var(--u));
    color: #e0d4be;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .toast.on{ opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 560px){
    .foot{ display: none; }
    .hint{ margin-top: calc(24 * var(--u)); }
  }

  /* 竖屏 / 窄屏：卡片拉高、字号放大，避免大片空白 */
  @media (max-aspect-ratio: 1/1){
    :root{ --stage: min(760px, 92vw); }
    .stage{ padding-top: max(8vh, 44px); }
    .card{ width: 100%; height: max(calc(326 * var(--u)), 42vh); }
    h1{ font-size: clamp(20px, 6.2vw, 28px); letter-spacing: .24em; text-indent: .24em; }
    .sub{ font-size: clamp(7px, 2.1vw, 9px); }
    .rule{ width: 46%; }
    .ask{ font-size: clamp(17px, 4.9vw, 22px); }
    .then{ font-size: clamp(11px, 3.2vw, 13px); }
    .hint{ font-size: clamp(11px, 3.3vw, 13px); margin-top: calc(34 * var(--u)); }
    .foot{ font-size: clamp(9.5px, 2.9vw, 11px); }
    .page{ font-size: clamp(9.5px, 2.9vw, 12px); }
  }

  @media (prefers-reduced-motion: reduce){
    .aura, .idle .dia, .hint{ animation: none; }
    .answer span, .under, .under i, .under .dia, .page{ animation-duration: .01ms !important; animation-delay: 0ms !important; }
  }
</style>
</head>
<body>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="aura" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <h1>答案之书</h1>

    <p class="sub">THE BOOK OF ANSWERS</p>

          <span class="dia" aria-hidden="true"></span>

        <div class="answer-wrap" id="wrap" aria-hidden="true">
          <p class="answer" id="answer"></p>
          <div class="under" aria-hidden="true"><span class="dia"></span><i></i><span class="dia"></span></div>
          <p class="page" id="page">第 0000 页</p>

      </div>
    </section>

    <div class="hint" id="hint">按下空格 · 或轻点书页</div>
    <div class="foot">本书收录 <b>1,884</b> 则答案 · v0.1</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>

    }
    ans.style.fontSize = (fontFor(text) * unit()).toFixed(2) + "px";
    page.textContent = "第 " + String(pageNo).padStart(4, "0") + " 页";
  }

  function applyScale() {
    if (!current) return;
    ans.style.fontSize = (fontFor(current) * unit()).toFixed(2) + "px";
  }

  function draw() {
    if (phase === "animating") { finish(); return; }

    if (pos >= DECK.length) { shuffle(); toast("已翻过一整轮 · 重新洗牌"); }
    clearTimers();

    var idx = DECK[pos];
    current = ANSWERS[idx];
    var pageNo = idx + 1;          // 页码与答案绑定：这一则永远在它自己的那一页
    pos++;
    render(current, pageNo);

    idle.classList.add("hide");
    wrap.classList.remove("reveal", "instant", "done");

    // 光带扫过
    card.classList.remove("sweeping");
    void card.offsetWidth;
    card.classList.add("sweeping");

    phase = "animating";
    hint.style.opacity = "0";
    hint.textContent = "\u2026";

    var n = current.length;
    var d = n * 28 + 240;

    wrap.style.setProperty("--d", d + "ms");
    wrap.style.setProperty("--dp", (d + 320) + "ms");

    later(function () {
      wrap.classList.add("on");
      wrap.classList.add("reveal");
      idle.style.display = "none";
      hint.textContent = "再按一次空格 · 再问一个";
      hint.style.opacity = "";
      phase = "answered";
      live.textContent = current;
      // 兜底：动画被打断/禁用时也要落到终态
      later(function () { wrap.classList.add("done"); }, n * 28 + 760);
    }, 430);

    later(function () {
      card.classList.remove("sweeping");
      phase = "answered";
    }, 1120);
  }

  function finish() {
    clearTimers();
    wrap.classList.add("on");
    wrap.classList.remove("reveal");
    wrap.classList.add("instant");
    card.classList.remove("sweeping");
    hint.textContent = "再按一次空格 · 再问一个";
    hint.style.opacity = "";
    phase = "answered";
    live.textContent = current;
  }

  function copy() {
    if (!current) return;
    var done = function () { toast("已复制"); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(current).then(done, fallback);
    } else {
      fallback();
    }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = current;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-100px";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch (e) { toast("复制失败"); }
    }
  }

  // ---------- 事件 ----------
  card.addEventListener("click", function (e) { e.preventDefault(); draw(); });
  card.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      e.stopPropagation();
      if (!e.repeat) draw();
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      draw();
    } else if (e.key === "c" || e.key === "C") {
      if (!e.ctrlKey && !e.metaKey && !e.altKey) copy();
    }
  });

  window.addEventListener("resize", applyScale);

  // ---------- 尘埃 ----------
  var cv = document.getElementById("dust");
  var ctx = cv.getContext("2d");
  var motes = [];
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function initDust() {
    cv.width  = Math.floor(innerWidth * dpr);
    cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + "px";
    cv.style.height = innerHeight + "px";
    motes = [];
    var count = Math.round(Math.min(56, Math.max(22, innerWidth / 26)));
    for (var i = 0; i < count; i++) {
      motes.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: 0.6 + Math.random() * 1.5,
        vy: -(0.06 + Math.random() * 0.22),
        vx: (Math.random() - 0.5) * 0.12,
        a: 0.05 + Math.random() * 0.16,
        ph: Math.random() * Math.PI * 2,
        gold: Math.random() < 0.55
      });
    }
  }

  function frame(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    var time = t / 1000;
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.y += m.vy;
      m.x += Math.sin(time * 0.32 + m.ph) * 0.06 + m.vx;
      if (m.y < -12) { m.y = innerHeight + 12; m.x = Math.random() * innerWidth; }
      var a = m.a * (0.55 + 0.45 * Math.sin(time * 0.6 + m.ph));
      if (a <= 0.004) continue;
      ctx.beginPath();
      ctx.globalAlpha = a;
      ctx.fillStyle = m.gold ? "#e8ce9e" : "#c8d6f0";
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  initDust();
  window.addEventListener("resize", initDust);
  if (!reduce) requestAnimationFrame(frame);
  else { /* 静态光尘：只画一帧 */ requestAnimationFrame(function (t) { frame(t); }); }

  // ---------- 预览参数：?preview=文字&page=12 / ?auto=1 ----------
  try {
    var q = new URLSearchParams(location.search);
    if (q.has("auto")) {
      setTimeout(draw, 80);
    } else if (q.has("preview")) {
      var txt = q.get("preview") || "答案在你决定不再问的那一刻";
      current = txt;
      render(txt, parseInt(q.get("page") || "77", 10));
      idle.style.display = "none";
      wrap.classList.add("on", "instant");
      wrap.style.setProperty("--d", "0ms");
      wrap.style.setProperty("--dp", "0ms");
      hint.textContent = "再按一次空格 · 再问一个";
      phase = "answered";
    }
  } catch (e) {}
})();
</script>
</body>
</html>
